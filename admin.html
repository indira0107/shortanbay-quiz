<!DOCTYPE html><html lang="kk"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#18243b;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:35px auto;padding:16px}.panel{background:white;border:1px solid #e1e6ef;border-radius:18px;padding:25px;box-shadow:0 8px 28px #15264a0b}.login{max-width:440px;margin:10vh auto}.title{font-size:28px;font-weight:800;margin:0 0 8px}.muted{color:#69758b}.field{width:100%;padding:13px;border:1px solid #cbd3e1;border-radius:10px;font-size:16px;margin:12px 0}button{background:#3157d5;color:white;border:0;border-radius:10px;padding:13px 20px;font-weight:700;cursor:pointer}.secondary{background:#e9eefb;color:#27449d}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.stat{background:#f3f6ff;padding:15px 18px;border-radius:12px;min-width:150px}.stat b{display:block;font-size:24px;margin-top:6px}.tablewrap{overflow:auto;margin-top:20px}table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e7ebf2;text-align:left;white-space:nowrap}th{background:#f5f7fb;position:sticky;top:0}.hide{display:none}#err{color:#b42318;margin-top:12px}
</style></head><body><div class="wrap"><section id="login" class="panel login"><div class="title">🔐 Оқытушы кабинеті</div><p class="muted">Шортанбай Quiz нәтижелері</p><label>Құпиясөз</label><input class="field" id="password" type="password" placeholder="Құпиясөзді енгізіңіз"><button onclick="login()">Кіру</button><div id="err"></div></section>
<section id="dashboard" class="panel hide"><div class="top"><div><div class="title">Оқытушы кабинеті</div><div class="muted">Студенттердің тест нәтижелері мен жауаптары</div></div><div><button class="secondary" onclick="loadResults()">↻ Жаңарту</button> <button onclick="logout()">Шығу</button></div></div><div id="dashErr" style="color:#b42318;margin-top:12px"></div><div class="stats"><div class="stat">Тапсырғандар<b id="count">0</b></div><div class="stat">Орташа ұпай<b id="avg">0%</b></div><div class="stat">Ең жоғары нәтиже<b id="best">0%</b></div></div><div class="tablewrap"><table id="results"></table></div></section></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzqJxLM629PzkRkA2bpO0ky1tg5WLbeK3IN6mCa-KSqb76N-WRv71z5l7kiqTIhoU0tJQ/exec";let token=null;
function post(action,payload){return new Promise((resolve,reject)=>{const f=document.getElementById("apiFrame");const h=e=>{if(e.data&&e.data.channel==="shortanbay-quiz"&&e.data.type===action){removeEventListener("message",h);e.data.result.ok?resolve(e.data.result.data):reject(new Error(e.data.result.error))}};addEventListener("message",h);const form=document.createElement("form");form.method="POST";form.action=API_URL;form.target="apiFrame";form.style.display="none";for(const [k,v] of Object.entries({action,payload:JSON.stringify(payload)})){const i=document.createElement("input");i.name=k;i.value=v;form.append(i)}document.body.append(form);form.submit();form.remove();setTimeout(()=>{removeEventListener("message",h);reject(new Error("Серверден жауап келмеді."))},20000)})}
function jsonp(params){return new Promise((resolve,reject)=>{const cb="cb_"+Date.now();window[cb]=d=>{delete window[cb];s.remove();resolve(d)};const s=document.createElement("script");s.src=API_URL+"?"+new URLSearchParams({...params,callback:cb});s.onerror=()=>reject(new Error("Серверге қосылу қатесі."));document.body.append(s)})}
async function login(){document.getElementById('err').textContent='';try{const d=await post("login",{password:document.getElementById('password').value});token=d.token;document.getElementById('login').classList.add('hide');document.getElementById('dashboard').classList.remove('hide');loadResults()}catch(e){document.getElementById('err').textContent=e.message}}
async function loadResults(){document.getElementById('dashErr').textContent='';try{render(await jsonp({action:"results",token}))}catch(e){document.getElementById('dashErr').textContent=e.message}}
function render(d){let rows=d.rows||[];document.getElementById('count').textContent=rows.length;let p=rows.map(r=>parseInt(String(r[5]).replace('%',''))||0);document.getElementById('avg').textContent=p.length?Math.round(p.reduce((a,b)=>a+b,0)/p.length)+'%':'0%';document.getElementById('best').textContent=(p.length?Math.max(...p):0)+'%';let t=document.getElementById('results');t.innerHTML='';let tr=document.createElement('tr');d.headers.forEach(h=>{let th=document.createElement('th');th.textContent=h;tr.append(th)});t.append(tr);rows.forEach(row=>{let r=document.createElement('tr');row.forEach(v=>{let td=document.createElement('td');td.textContent=v==null?'':v;r.append(td)});t.append(r)})}
function logout(){token=null;location.reload()}document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script><iframe id="apiFrame" name="apiFrame" style="display:none"></iframe></body></html>
